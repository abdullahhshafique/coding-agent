<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Coding agent orchestrator flow</title>
<desc>Animated diagram showing data packets traveling from CLI input through the Orchestrator to three tools (GitHubTool, ASTTool, LLMTool), into a Validator, ending in either a generated patch or a loud failure with trace.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="620" fill="#0a0a0c"/>

<!-- CLI node -->
<g>
<rect x="270" y="30" width="140" height="44" rx="6" fill="#28252c" stroke="#f5b8d0" stroke-width="0.5"/>
<text x="340" y="52" text-anchor="middle" dominant-baseline="central" fill="#f4f2ef" font-family="sans-serif" font-size="14" font-weight="500">CLI</text>
</g>

<!-- Connector CLI -> Orchestrator -->
<line id="l1" x1="340" y1="74" x2="340" y2="112" stroke="#7d7a73" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Orchestrator node -->
<g>
<rect x="230" y="116" width="220" height="56" rx="8" fill="#131318" stroke="#f5b8d0" stroke-width="1"/>
<text x="340" y="136" text-anchor="middle" dominant-baseline="central" fill="#f5b8d0" font-family="sans-serif" font-size="14" font-weight="500">Orchestrator</text>
<text x="340" y="154" text-anchor="middle" dominant-baseline="central" fill="#e8e6e3" font-family="sans-serif" font-size="12">Owns RunState, tool budget</text>
</g>

<!-- Connectors Orchestrator -> 3 tools -->
<path id="l2" d="M270 172 L270 200 L120 200 L120 224" fill="none" stroke="#22d3ee" stroke-width="0.5" marker-end="url(#arrow)"/>
<line id="l3" x1="340" y1="172" x2="340" y2="224" stroke="#22d3ee" stroke-width="0.5" marker-end="url(#arrow)"/>
<path id="l4" d="M410 172 L410 200 L560 200 L560 224" fill="none" stroke="#22d3ee" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- GitHubTool -->
<g>
<rect x="50" y="228" width="140" height="56" rx="8" fill="#131318" stroke="#22d3ee" stroke-width="0.5"/>
<text x="120" y="248" text-anchor="middle" dominant-baseline="central" fill="#22d3ee" font-family="sans-serif" font-size="14" font-weight="500">GitHubTool</text>
<text x="120" y="266" text-anchor="middle" dominant-baseline="central" fill="#e8e6e3" font-family="sans-serif" font-size="12">Search, fetch, read-only</text>
</g>

<!-- ASTTool -->
<g>
<rect x="270" y="228" width="140" height="56" rx="8" fill="#131318" stroke="#22d3ee" stroke-width="0.5"/>
<text x="340" y="248" text-anchor="middle" dominant-baseline="central" fill="#22d3ee" font-family="sans-serif" font-size="14" font-weight="500">ASTTool</text>
<text x="340" y="266" text-anchor="middle" dominant-baseline="central" fill="#e8e6e3" font-family="sans-serif" font-size="12">stdlib ast, tree-sitter</text>
</g>

<!-- LLMTool -->
<g>
<rect x="490" y="228" width="140" height="56" rx="8" fill="#131318" stroke="#22d3ee" stroke-width="0.5"/>
<text x="560" y="248" text-anchor="middle" dominant-baseline="central" fill="#22d3ee" font-family="sans-serif" font-size="14" font-weight="500">LLMTool</text>
<text x="560" y="266" text-anchor="middle" dominant-baseline="central" fill="#e8e6e3" font-family="sans-serif" font-size="12">Groq, generate patch</text>
</g>

<!-- Connectors 3 tools -> Validator -->
<path id="l5" d="M120 284 L120 320 L270 320 L270 344" fill="none" stroke="#7d7a73" stroke-width="0.5" marker-end="url(#arrow)"/>
<line id="l6" x1="340" y1="284" x2="340" y2="344" stroke="#7d7a73" stroke-width="0.5" marker-end="url(#arrow)"/>
<path id="l7" d="M560 284 L560 320 L410 320 L410 344" fill="none" stroke="#7d7a73" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Validator -->
<g>
<rect x="230" y="348" width="220" height="56" rx="8" fill="#131318" stroke="#f5b8d0" stroke-width="1"/>
<text x="340" y="368" text-anchor="middle" dominant-baseline="central" fill="#f5b8d0" font-family="sans-serif" font-size="14" font-weight="500">Validator</text>
<text x="340" y="386" text-anchor="middle" dominant-baseline="central" fill="#e8e6e3" font-family="sans-serif" font-size="12">Lenient parse, strict apply</text>
</g>

<!-- Connectors Validator -> outcomes -->
<path id="l8" d="M300 404 L300 430 L170 430 L170 454" fill="none" stroke="#00ff88" stroke-width="0.5" marker-end="url(#arrow)"/>
<path id="l9" d="M380 404 L380 430 L510 430 L510 454" fill="none" stroke="#f59e0b" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Patch outcome -->
<g>
<rect x="70" y="458" width="200" height="56" rx="8" fill="#131318" stroke="#00ff88" stroke-width="0.5"/>
<text x="170" y="478" text-anchor="middle" dominant-baseline="central" fill="#00ff88" font-family="sans-serif" font-size="14" font-weight="500">Patch generated</text>
<text x="170" y="496" text-anchor="middle" dominant-baseline="central" fill="#e8e6e3" font-family="sans-serif" font-size="12">Reviewable unified diff</text>
</g>

<!-- Failure outcome -->
<g>
<rect x="410" y="458" width="200" height="56" rx="8" fill="#131318" stroke="#f59e0b" stroke-width="0.5"/>
<text x="510" y="478" text-anchor="middle" dominant-baseline="central" fill="#f59e0b" font-family="sans-serif" font-size="14" font-weight="500">Loud failure</text>
<text x="510" y="496" text-anchor="middle" dominant-baseline="central" fill="#e8e6e3" font-family="sans-serif" font-size="12">Full trace, exits non-zero</text>
</g>

<!-- Connectors outcomes -> TraceLogger -->
<path id="l10" d="M170 514 L170 540 L340 540 L340 558" fill="none" stroke="#9c988f" stroke-width="0.5" marker-end="url(#arrow)"/>
<path id="l11" d="M510 514 L510 540 L340 540 L340 558" fill="none" stroke="#9c988f" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- TraceLogger -->
<g>
<rect x="230" y="562" width="220" height="44" rx="6" fill="#28252c" stroke="#f5b8d0" stroke-width="0.5"/>
<text x="340" y="584" text-anchor="middle" dominant-baseline="central" fill="#f4f2ef" font-family="sans-serif" font-size="14" font-weight="500">TraceLogger</text>
</g>

<!-- Traveling packets -->
<circle r="4" fill="#f5b8d0">
<animateMotion dur="1.6s" repeatCount="indefinite" path="M340 74 L340 112"/>
</circle>
<circle r="4" fill="#22d3ee">
<animateMotion dur="1.6s" repeatCount="indefinite" begin="0.3s" path="M270 172 L270 200 L120 200 L120 224"/>
</circle>
<circle r="4" fill="#22d3ee">
<animateMotion dur="1.6s" repeatCount="indefinite" begin="0.3s" path="M340 172 L340 224"/>
</circle>
<circle r="4" fill="#22d3ee">
<animateMotion dur="1.6s" repeatCount="indefinite" begin="0.3s" path="M410 172 L410 200 L560 200 L560 224"/>
</circle>
<circle r="4" fill="#f5b8d0">
<animateMotion dur="1.6s" repeatCount="indefinite" begin="0.3s" path="M120 284 L120 320 L270 320 L270 344"/>
</circle>
<circle r="4" fill="#f5b8d0">
<animateMotion dur="1.6s" repeatCount="indefinite" begin="0.3s" path="M340 284 L340 344"/>
</circle>
<circle r="4" fill="#f5b8d0">
<animateMotion dur="1.6s" repeatCount="indefinite" begin="0.3s" path="M560 284 L560 320 L410 320 L410 344"/>
</circle>
<circle r="4" fill="#00ff88">
<animateMotion dur="1.6s" repeatCount="indefinite" begin="0.3s" path="M300 404 L300 430 L170 430 L170 454"/>
</circle>
<circle r="4" fill="#f59e0b">
<animateMotion dur="1.6s" repeatCount="indefinite" begin="0.3s" path="M380 404 L380 430 L510 430 L510 454"/>
</circle>
<circle r="4" fill="#7d7a73">
<animateMotion dur="1.6s" repeatCount="indefinite" begin="0.3s" path="M170 514 L170 540 L340 540 L340 558"/>
</circle>
<circle r="4" fill="#7d7a73">
<animateMotion dur="1.6s" repeatCount="indefinite" begin="0.3s" path="M510 514 L510 540 L340 540 L340 558"/>
</circle>
</svg>
